<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMS566 Internship Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Sidebar -->
    <nav>
        <div class="logo">
            <div class="logo-image">
                <img src="uitm logo.png" alt="UiTM Logo">
            </div>
        </div>
        <div class="menu-items">
            <ul class="navLinks">
                <li class="navList active">
                    <a href="#">
                        <ion-icon name="grid-outline"></ion-icon>
                        <span class="links">Dashboard</span>
                    </a>
                </li>
                <li class="navList">
                    <a href="#">
                        <ion-icon name="people-outline"></ion-icon>
                        <span class="links">Interns</span>
                    </a>
                </li>
                <li class="navList">
                    <a href="#">
                        <ion-icon name="briefcase-outline"></ion-icon>
                        <span class="links">Companies</span>
                    </a>
                </li>
            </ul>
            <ul class="bottom-link">
                <li>
                    <a href="#" onclick="resetSystemData()">
                        <ion-icon name="refresh-outline"></ion-icon>
                        <span class="links">Reset Data</span>
                    </a>
                </li>
                <li>
                    <a href="login.html">
                        <ion-icon name="log-out-outline"></ion-icon>
                        <span class="links">Logout</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <section class="dashboard">
        <div class="container-fluid p-0">
            
            <div class="data-table dashboard-view">
                <div class="title">
                    <ion-icon name="grid-outline"></ion-icon>
                    <span class="text ms-2">Overview</span>
                </div>

                <div class="dashboard-grid">
                    
                    <div class="main-display">
                        <div class="chart-container main-chart">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5>Placement Success Rate</h5>
                                <span class="badge bg-light text-dark border">Live</span>
                            </div>
                            <div style="height: 300px; width: 100%;">
                                <canvas id="internshipChart"></canvas>
                            </div>
                        </div>

                        <div class="chart-container mini-chart mt-3">
                            <h6>Top Hiring Companies</h6>
                            <div style="height: 200px; width: 100%;">
                                <canvas id="companyChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <div class="stats-sidebar">
                        <div class="box">
                            <div class="box-icon"><ion-icon name="people-outline"></ion-icon></div>
                            <div>
                                <span class="text">Total Students</span>
                                <span class="number" id="count-total">0</span>
                            </div>
                        </div>
                        <div class="box">
                            <div class="box-icon success"><ion-icon name="checkmark-circle-outline"></ion-icon></div>
                            <div>
                                <span class="text">Placed</span>
                                <span class="number" id="count-placed">0</span>
                            </div>
                        </div>
                        <div class="box">
                            <div class="box-icon warning"><ion-icon name="time-outline"></ion-icon></div>
                            <div>
                                <span class="text">Pending</span>
                                <span class="number" id="count-pending">0</span>
                            </div>
                        </div>
                        <div class="box">
                            <div class="box-icon info"><ion-icon name="business-outline"></ion-icon></div>
                            <div>
                                <span class="text">Partners</span>
                                <span class="number">12</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- VIEW 2: INTERNS LIST -->
            <div style="display:none" class="data-table">
                <div class="title">
                    <ion-icon name="people-outline"></ion-icon>
                    <span class="text ms-2">Intern List</span>
                </div>

                <div class="card">
                    <h6 class="mb-3">Add New Student</h6>
                    <form id="addInternForm" class="row g-3 align-items-center">
                        <div class="col-md-4 col-12">
                            <input type="text" class="form-control" id="newInternName" placeholder="Name" required>
                        </div>
                        <div class="col-md-3 col-6">
                            <input type="text" class="form-control" id="newInternCompany" placeholder="Company">
                        </div>
                        <div class="col-md-3 col-6">
                            <select class="form-select" id="newInternStatus">
                                <option value="Pending">Pending</option>
                                <option value="Placed">Placed</option>
                            </select>
                        </div>
                        <div class="col-md-2 col-12">
                            <button type="submit" class="btn btn-primary w-100">Add</button>
                        </div>
                    </form>
                </div>

                <div class="table-card">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 text-nowrap">
                            <thead>
                                <tr>
                                    <th>Student ID</th>
                                    <th>Name</th>
                                    <th>Company</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="internTableBody">
                                <!-- JS Injected -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div style="display:none" class="data-table">
                <div class="title">
                    <ion-icon name="briefcase-outline"></ion-icon>
                    <span class="text ms-2">Industry Opportunities</span>
                </div>
                
                <div id="companyFeed" class="company-feed">
                    <!-- Cards will be injected by JS here -->
                </div>
            </div>

            <footer class="mt-5 text-center small pb-4">
                <hr>
                <!-- START: Blue Pac-Man Loader -->
                <div class="d-flex justify-content-center mb-3">
                    <div class="loader"></div>
                </div>
                <!-- END: Loader -->
                <p>&copy; 2025 IMS566 Internship Tracker.</p>
                <div class="icon">
                    <a href="https://www.instagram.com/uitm.official/?hl=en"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://www.tiktok.com/@uitm_channel"><i class="fa-brands fa-tiktok"></i></a> 
                    <a href="https://www.facebook.com/uitmrasmi/"><i class="fa-brands fa-facebook"></i></a>
                    <a href="mailto:muhammadhafizzie04@gmail.com"><i class="fa-regular fa-message"></i></a>
                </div>
            </footer>

        </div>
    </section>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="index.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
